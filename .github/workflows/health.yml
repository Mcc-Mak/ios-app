# health.yml — 每日排程建置,及早發現 runner/Xcode 版本漂移。
# 若未簽署建置在目前 macos-latest 映像或 latest-stable Xcode 上不再成功即失敗。
# 不發布任何成品。
name: 健康檢查

on:
  schedule:
    - cron: '17 6 * * *'   # 每日 ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 排程未簽署建置檢查
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 選擇 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 設定腳本為可執行
        run: chmod +x codebase/scripts/*.sh

      - name: 建置並打包未簽署 IPA
        run: ./codebase/scripts/build_unsigned_ipa.sh

      - name: 回報
        run: echo "::notice::未簽署建置在 $(uname -sr) 上成功,Xcode 為 $(xcodebuild -version | head -n1)。"
