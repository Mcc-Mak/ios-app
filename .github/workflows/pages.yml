# pages.yml — 建置並部署靜態側載入口網站 + AltStore/SideStore apps.json 饋流至
# GitHub Pages。於網站/設定變更(main)或透過 workflow_dispatch(release.yml 在
# 新發行版本後呼叫)觸發。
#
# 需一次性儲存庫設定:Settings → Pages → Build and deployment →
# Source = "GitHub Actions"(非分支)。
name: GitHub Pages 部署

on:
  push:
    branches: [main]
    paths:
      - 'codebase/site/**'
      - 'codebase/app.config.json'
      - 'codebase/scripts/generate_apps_json.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write   # actions/deploy-pages 必要

# 同一時間僅一個 Pages 部署。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置網站與 apps.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定腳本為可執行
        run: chmod +x codebase/scripts/*.sh

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 暫存網站
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r codebase/site/. _site/

      - name: 產生 apps.json(最新發行版本)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./codebase/scripts/generate_apps_json.sh _site/apps.json codebase/app.config.json

      - name: 顯示產生的饋流
        run: cat _site/apps.json

      - name: 上傳 Pages 成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署至 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
