# cicd.yml — iOS 管線(單一工作流程,多個 job)
#
# ⚠ 目前狀態(2026-11-19,v2.1.0 過渡架構):
#   - 本機 Windows 匯出 Xcode 專案 → CI macOS 執行 xcodebuild → .ipa
#     原因:Tuanjie 授權(.alf)為機器綁定,僅本機可用;Windows 無 xcodebuild。
#     解法:本機用 Tuanjie 匯出 Xcode 專案(授權在本機),上傳至 GitHub Release,
#     CI macOS runner 下載後執行 xcodebuild(不需 Unity 授權)。
#   - 分塊資料(.glb)改以 GitHub Release asset 提供(data-* 標籤,不觸發管線),
#     建置前由 codebase/scripts/fetch_chunks.sh 下載注入 StreamingAssets/Chunks/。
#   - test:sast 維持停用(待 Unity 授權續期 + 設定 CI secret 後以 GameCI 重建)。
#   - deploy:docs 於 push 及 workflow_dispatch 皆執行,維護入口網站與 apps.json 饋流。
#
# 階段順序(每個 job 顯示名稱皆為「*:*」):
#   test:sast    → [停用] Unity 測試(GameCI unity-test-runner)+ CodeQL C#
#   build:ipa    → [僅 workflow_dispatch] 下載 Xcode 匯出 → xcodebuild 未簽署封存 →
#                  .ipa + dSYM + manifest.json → 上傳至目標 release
#   release:ipa  → [已合併至 build:ipa] build job 直接上傳資產至 release
#   deploy:docs  → 部署入口網站,並由最新 Release 重新產生 apps.json
#
# 觸發:
#   - push 至 main(部署入口網站)
#   - push 標籤 v*(部署入口網站)
#   - pull_request 至 main(目前無建置,僅觸發 workflow 供觀察)
#   - 每日排程(健康檢查)
#   - workflow_dispatch(手動觸發 build:ipa + deploy:docs)
#     輸入:xcode_export_tag(Xcode 匯出 release 標籤)、release_tag(目標發行標籤)
#
# 零 Apple 機密:僅使用內建 GITHUB_TOKEN。所有 xcodebuild 皆未簽署:
#   CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
#   CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
#   (Unity 匯出在本機執行;CI 僅跑 xcodebuild,不需 Unity 授權;Apple 簽署零)
#
# 一次性儲存庫設定:
#   Settings → Pages → Build and deployment → Source = GitHub Actions(非分支)
#   Settings → Actions → General → Workflow permissions = Read and write
name: iOS 管線

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # 每日 ~06:17 UTC:未簽署建置健康檢查
  workflow_dispatch:
    inputs:
      xcode_export_tag:
        description: '包含 Xcode 匯出資產的 release 標籤(如 xcode-export-v2.1.0)'
        required: true
        type: string
      release_tag:
        description: '目標發行標籤(上傳 .ipa 的 release,如 v2.1.0)'
        required: true
        type: string

# 僅取消 pull_request 上被取代的舊執行;main / 標籤的執行(含 Pages 部署)不中斷。
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- test:sast
  # [停用 v2.0.0] Swift App 已移除,無建置標的;待 Stage C 以 GameCI 重建。
  test:
    name: 'test:sast'
    if: false   # 停用:待 Stage C 重建為 Unity 測試
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write   # CodeQL 上傳 SARIF 必要
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 選擇 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 設定腳本為可執行
        run: chmod +x codebase/scripts/*.sh

      - name: 探索專案與 scheme
        id: discover
        run: |
          set -euo pipefail
          project=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" -not -path "*/.build/*" -not -path "*/DerivedData/*" -not -path "*/build/*" | head -n1 || true)
          workspace=$(find . -maxdepth 4 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*/.build/*" -not -path "*/DerivedData/*" -not -path "*/build/*" -not -path "*/.xcodeproj/project.xcworkspace" | head -n1 || true)
          args=()
          if [[ -n "$workspace" ]]; then args=(-workspace "$workspace"); else args=(-project "$project"); fi
          scheme=$(xcodebuild -list "${args[@]}" 2>/dev/null | awk '/Schemes:/{f=1;next} f&&/^$/{f=0} f{print}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | head -n1 || true)
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "已探索 scheme:$scheme"

      - name: 執行單元與 UI 測試(未簽署)
        if: steps.discover.outputs.scheme != ''
        run: |
          set -euo pipefail
          project=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" -not -path "*/.build/*" -not -path "*/DerivedData/*" -not -path "*/build/*" | head -n1 || true)
          workspace=$(find . -maxdepth 4 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*/.build/*" -not -path "*/DerivedData/*" -not -path "*/build/*" -not -path "*/.xcodeproj/project.xcworkspace" | head -n1 || true)
          args=()
          if [[ -n "$workspace" ]]; then args=(-workspace "$workspace"); else args=(-project "$project"); fi
          # 動態選取可用 iPhone 模擬器(避免特定機型名稱在不同 Xcode 版本不存在)。
          sim_udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((dev['udid'] for rt,devs in d['devices'].items() for dev in devs if 'iPhone' in dev.get('name','') and dev.get('isAvailable')), ''))")
          [[ -n "$sim_udid" ]] || { echo "::error::找不到可用 iPhone 模擬器"; exit 1; }
          echo "使用模擬器 UDID:$sim_udid"
          xcrun simctl boot "$sim_udid" 2>/dev/null || true
          xcodebuild test "${args[@]}" \
            -scheme "${{ steps.discover.outputs.scheme }}" \
            -destination "id=$sim_udid" \
            -enableCodeCoverage YES \
            -resultBundlePath build/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""

      - name: 匯出程式碼覆蓋率報告
        if: always() && steps.discover.outputs.scheme != ''
        run: |
          mkdir -p build/reports
          if [[ -d build/Test.xcresult ]]; then
            xcrun xccov view --report --json build/Test.xcresult > build/reports/coverage.json 2>/dev/null || true
            xcrun xccov view --report build/Test.xcresult > build/reports/coverage.txt 2>/dev/null || true
          fi

      - name: 上傳測試結果與覆蓋率
        if: always() && steps.discover.outputs.scheme != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/Test.xcresult
            build/reports/
          if-no-files-found: ignore
          retention-days: 14

      # ---- SAST:CodeQL Swift(需先 init,再讓未簽署建置被儀器化)----
      # 先上傳測試成品再跑 CodeQL 建置,因為建置腳本會清除 build/ 目錄。
      - name: 初始化 CodeQL
        if: ${{ success() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          # 停用自動建置 — 我們自行執行未簽署建置(build-mode: manual)。
          build-mode: manual

      - name: 建置(未簽署,由 CodeQL 觀察)
        if: ${{ success() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: ./codebase/scripts/build_unsigned_ipa.sh

      - name: 執行 CodeQL 分析
        if: ${{ success() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:swift'

  # ----------------------------------------------------------------- build:ipa
  # [v2.1.0] 本機 Windows 匯出 Xcode 專案 → CI macOS 執行 xcodebuild → .ipa
  # 僅 workflow_dispatch 觸發:使用者先在本機匯出 Xcode 專案、上傳至 GitHub Release,
  # 再以 workflow_dispatch 指定 xcode_export_tag 與 release_tag 觸發此 job。
  # CI 不需 Unity 授權(僅跑 xcodebuild);Unity 授權留於本機。
  build:
    name: 'build:ipa'
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write   # 上傳 .ipa / dSYM / manifest.json 至 release
    env:
      # IL2CPP 為 .NET 應用程式;在無 TTY 的 CI 環境下,ConsolePal 初始化會崩潰
      # (OutOfMemoryException: Array dimensions exceeded supported range —
      # .NET 6 在 macOS 14+ 管道環境的已知問題)。
      # TERM/COLUMNS/LINES 提供終端尺寸 fallback;build_unity_ipa.sh 另以
      # script 指令提供 pseudo-TTY 徹底解決。
      TERM: dumb
      COLUMNS: '80'
      LINES: '24'
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 選擇 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 設定腳本為可執行
        run: chmod +x codebase/scripts/*.sh

      - name: 下載 Xcode 匯出資產
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.xcode_export_tag }}"
          echo "從 release $tag 下載 Xcode 匯出資產..."
          mkdir -p build/xcode-download
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "xcode-export-*.tar.gz" --dir build/xcode-download
          echo "下載完成:"
          ls -lh build/xcode-download/

      - name: 解壓 Xcode 匯出
        run: |
          set -euo pipefail
          mkdir -p build/ios-xcode
          tarball=$(find build/xcode-download -name "xcode-export-*.tar.gz" | head -n1)
          echo "解壓 $tarball → build/ios-xcode/"
          tar -xzf "$tarball" -C build/ios-xcode --strip-components=1
          echo "解壓完成。.xcodeproj:"
          find build/ios-xcode -maxdepth 1 -name "*.xcodeproj"

      - name: 修補 IL2CPP(pseudo-TTY wrapper,修正 .NET ConsolePal 崩潰)
        run: |
          set -euo pipefail
          # Tuanjie 2022.3 的 IL2CPP 為 .NET 應用程式,在無 TTY 的 CI 管道環境下,
          # System.ConsolePal 靜態建構式崩潰(OutOfMemoryException:
          # Array dimensions exceeded supported range)。
          # 解法:將 IL2CPP 二進位檔重新命名為 .real,建立 wrapper 腳本以
          # /usr/bin/script(1) 提供 pseudo-TTY。IL2CPP 及其子行程繼承 PTY,
          # .NET ConsolePal 偵測到 TTY 後走正常初始化路徑。
          #
          # 注意:tarball 在 Windows 上建立,不保留 Unix 執行位元,故需明確
          # chmod +x il2cpp.real(建置階段腳本只 chmod $IL2CPP = wrapper)。
          for arch in deploy_arm64 deploy_x86_64; do
            il2cpp_dir="build/ios-xcode/Il2CppOutputProject/IL2CPP/build/$arch"
            if [[ -f "$il2cpp_dir/il2cpp" && ! -f "$il2cpp_dir/il2cpp.real" ]]; then
              mv "$il2cpp_dir/il2cpp" "$il2cpp_dir/il2cpp.real"
              chmod +x "$il2cpp_dir/il2cpp.real"
              cat > "$il2cpp_dir/il2cpp" << 'WRAPPER'
          #!/bin/sh
          exec /usr/bin/script -q /dev/null "$(dirname "$0")/il2cpp.real" "$@"
          WRAPPER
              chmod +x "$il2cpp_dir/il2cpp"
              echo "✅ 已以 pseudo-TTY wrapper 包裹 $arch/il2cpp"
            fi
          done

      - name: xcodebuild 封存並打包 .ipa(未簽署)
        id: build
        env:
          XCODEBUILD_ONLY: '1'
          XCODE_PROJECT_DIR: ${{ github.workspace }}/build/ios-xcode
          ARCHIVE_DIR: ${{ github.workspace }}/build
          OUTPUT_DIR: ${{ github.workspace }}/build/output
        run: ./codebase/scripts/build_unity_ipa.sh

      - name: 上傳 .ipa 成品(供下載)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: |
            build/output/*.ipa
            build/output/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: 上傳 dSYM 符號檔
        uses: actions/upload-artifact@v4
        with:
          name: dsym
          path: build/output/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: 上傳 .ipa 至目標 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          manifest="build/output/manifest.json"
          app=$(jq -r '.appName' "$manifest")
          ver=$(jq -r '.version' "$manifest")

          # 建立 release(若不存在);不使用 --verify-tag,允許自動建立標籤
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::發行版本 $tag 已存在,更新資產。"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$app $ver" \
              --generate-notes
            echo "已建立發行版本 $tag"
          fi

          # 收集資產(nullglob 避免空 glob)
          shopt -s nullglob
          assets=(build/output/*.ipa "$manifest")
          dsyms=(build/output/*.dSYM.zip)
          shopt -u nullglob
          if (( ${#dsyms[@]} )); then assets+=("${dsyms[@]}"); fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          echo "已上傳資產至 release $tag"

      - name: 寫入執行摘要
        run: |
          {
            echo "### iOS 建置完成(未簽署)"
            echo ""
            echo "| 項目 | 值 |"
            echo "| --- | --- |"
            echo "| Xcode 匯出來源 | \`${{ inputs.xcode_export_tag }}\` |"
            echo "| 目標發行標籤 | \`${{ inputs.release_tag }}\` |"
            echo "| IPA 檔名 | \`${{ steps.build.outputs.ipa-file-name }}\` |"
            echo "| App | ${{ steps.build.outputs.app-name }} |"
            echo "| 版本 | ${{ steps.build.outputs.app-version }} |"
            echo "| Bundle ID | ${{ steps.build.outputs.bundle-id }} |"
            echo ""
            echo "- Release:https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}"
            echo "- 入口網站:https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- deploy:docs
  # [v2.1.0] build:ipa 僅 workflow_dispatch 觸發;deploy 於 push 及 workflow_dispatch 皆執行。
  # needs: build 確保 workflow_dispatch 時,deploy 在 build 完成後才執行(重新產生 apps.json)。
  # push 時 build 被跳過(if: workflow_dispatch),deploy 仍正常執行(skipped needs 視為成功)。
  deploy:
    name: 'deploy:docs'
    needs: build
    if: |
      always() && !cancelled()
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write   # actions/deploy-pages 必要
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 同一時間僅一個 Pages 部署,且不取消進行中的部署。
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定腳本為可執行
        run: chmod +x codebase/scripts/*.sh

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 暫存網站
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r codebase/site/. _site/

      - name: 產生 apps.json(最新發行版本)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./codebase/scripts/generate_apps_json.sh _site/apps.json codebase/app.config.json

      - name: 顯示產生的饋流
        run: cat _site/apps.json

      - name: 寫入執行摘要
        run: |
          {
            echo "### 入口網站與發行饋流"
            echo ""
            echo "- 網站:https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "- 饋流:https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apps.json"
            echo "- 最新發行版本:https://github.com/${{ github.repository }}/releases/latest"
            echo ""
            echo '```json'
            cat _site/apps.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上傳 Pages 成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4