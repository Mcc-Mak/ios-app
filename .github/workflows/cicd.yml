# cicd.yml — iOS 管線(單一工作流程,多個 job)
#
# ⚠ 目前狀態(2026-11-25,v2.2.18):
#   - 本機 Windows 匯出 Xcode 專案 → CI macOS 執行 xcodebuild → .ipa
#     原因:Tuanjie 授權(.alf)為機器為機器綁定,僅本機可用;Windows 無 xcodebuild。
#     解法:本機用 Tuanjie 匯出 Xcode 專案(授權在本機),上傳至 GitHub Release,
#     CI macOS runner 下載後執行 xcodebuild(不需 Unity 授權)。
#   - 分塊資料(.glb)由本機 export_xcode_project.ps1 -ChunksSource 注入至
#     StreamingAssets/Chunks/,烘焙進 Xcode 匯出成品(不再使用 fetch_chunks.sh)。
#   - test:sast 已移除(原 Swift/SceneKit App 已不存在;待 Stage C 以 GameCI 重建)。
#   - deploy:docs [v2.6.1 停用] 儲存庫已改為私有,GitHub Pages 需付費方案;
#     入口網站 + apps.json 饋流不再部署。IPA 直接由 GitHub Releases 下載。
#
# 階段順序(每個 job 顯示名稱皆為「*:*」):
#   test:sast    → [已移除] 原 Swift/SceneKit 測試已不存在;待 Stage C GameCI 重建
#   build:ipa    → [僅 workflow_dispatch] 下載 Xcode 匯出 → xcodebuild 未簽署封存 →
#                  .ipa + dSYM + manifest.json → 上傳至目標 release
#   release:ipa  → [已合併至 build:ipa] build job 直接上傳資產至 release
#   deploy:docs  → 部署入口網站,並由最新 Release 重新產生 apps.json
#
# 觸發:
#   - push 至 main(部署入口網站)
#   - push 標籤 v*(部署入口網站)
#   - pull_request 至 main(目前無建置,僅觸發 workflow 供觀察)
#   - 每日排程(健康檢查)
#   - workflow_dispatch(手動觸發 build:ipa;deploy:docs 已停用)
#     輸入:xcode_export_tag(Xcode 匯出 release 標籤)、release_tag(目標發行標籤)
#
# 零 Apple 機密:僅使用內建 GITHUB_TOKEN。所有 xcodebuild 皆未簽署:
#   CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
#   CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
#   (Unity 匯出在本機執行;CI 僅跑 xcodebuild,不需 Unity 授權;Apple 簽署零)
#
# 一次性儲存庫設定:
#   Settings → Pages → Build and deployment → Source = GitHub Actions(非分支)
#   Settings → Actions → General → Workflow permissions = Read and write
name: iOS 管線

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # 每日 ~06:17 UTC:未簽署建置健康檢查
  workflow_dispatch:
    inputs:
      xcode_export_tag:
        description: '包含 Xcode 匯出資產的 release 標籤(如 xcode-export-v2.1.0)'
        required: true
        type: string
      release_tag:
        description: '目標發行標籤(上傳 .ipa 的 release,如 v2.1.0)'
        required: true
        type: string

# 僅取消 pull_request 上被取代的舊執行;main / 標籤的執行(含 Pages 部署)不中斷。
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- test:sast
  # [停用 v2.0.0] 原 Swift/SceneKit App 已移除,此 job 待 Stage C 以 GameCI +
  # Unity 授權重建(ADR-010)。舊 Swift 模擬器測試 + CodeQL Swift 分析已刪除
  # (build_unsigned_ipa.sh 一併移除——無 Swift 建置標的)。

  # ----------------------------------------------------------------- build:ipa
  # [v2.1.0] 本機 Windows 匯出 Xcode 專案 → CI macOS 執行 xcodebuild → .ipa
  # 僅 workflow_dispatch 觸發:使用者先在本機匯出 Xcode 專案、上傳至 GitHub Release,
  # 再以 workflow_dispatch 指定 xcode_export_tag 與 release_tag 觸發此 job。
  # CI 不需 Unity 授權(僅跑 xcodebuild);Unity 授權留於本機。
  # v2.2.15: 確認未停用(非 if: false)——可經 workflow_dispatch 手動觸發。
  build:
    name: 'build:ipa'
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: write   # 上傳 .ipa / dSYM / manifest.json 至 release
    env:
      # Tuanjie 的 il2cpp 為 .NET 6 應用程式。.NET 6 在 macOS Apple Silicon(arm64)
      # 虛擬機中,ReadyToRun 程式碼傳遞 variadic 引數違反 arm64 ABI,ConsolePal..cctor
      # 建立陣列時崩潰(dotnet/runtime#64103)。macos-15 runner 為 arm64 VM,觸發此 bug。
      # 真正的修正是下方「修補 IL2CPP」步驟安裝的 il2cpp_pty_wrapper.sh
      # (COMPlus_ReadyToRun=0 停用 R2R,改用 JIT)。
      COMPlus_ReadyToRun: '0'
      DOTNET_ReadyToRun: '0'
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 選擇 Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1(釘選 commit SHA)
        with:
          xcode-version: '16.2'

      - name: 設定腳本為可執行
        run: chmod +x codebase/scripts/*.sh

      - name: 下載 Xcode 匯出資產
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE_EXPORT_TAG: ${{ inputs.xcode_export_tag }}
        run: |
          set -euo pipefail
          tag="$XCODE_EXPORT_TAG"
          echo "從 release $tag 下載 Xcode 匯出資產..."
          mkdir -p build/xcode-download
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "xcode-export-*.tar.gz" --dir build/xcode-download
          echo "下載完成:"
          ls -lh build/xcode-download/

      - name: 解壓 Xcode 匯出
        run: |
          set -euo pipefail
          mkdir -p build/ios-xcode
          tarball=$(find build/xcode-download -name "xcode-export-*.tar.gz" | head -n1)
          echo "解壓 $tarball → build/ios-xcode/"
          tar -xzf "$tarball" -C build/ios-xcode --strip-components=1
          echo "解壓完成。.xcodeproj:"
          find build/ios-xcode -maxdepth 1 -name "*.xcodeproj"

      - name: 安裝 iOS 平台(ibtool 編譯 storyboard 需要)
        run: |
          set +e
          echo "=== iPhoneSimulator.platform ==="
          ls -d /Applications/Xcode_16.2.app/Contents/Developer/Platforms/iPhoneSimulator.platform 2>/dev/null && echo "已安裝" || echo "未安裝"
          echo "=== 模擬器 runtime ==="
          xcrun simctl list runtimes 2>&1 | head -20
          echo "=== 嘗試安裝 iOS 平台 ==="
          xcodebuild -downloadPlatform iOS 2>&1 || echo "(下載失敗或已安裝)"
          echo "=== 安裝後再檢查 ==="
          xcrun simctl list runtimes 2>&1 | head -20

      - name: 修補 IL2CPP(停用 ReadyToRun,修正 .NET 6 arm64 VM 崩潰)
        run: |
          set -euo pipefail
          # Tuanjie 2022.3 的 il2cpp 為 .NET 6 應用程式。.NET 6 在 macOS Apple Silicon
          # (arm64)虛擬機中,ReadyToRun(R2R)編譯的程式碼傳遞 variadic 引數時使用暫存器
          # 而非堆疊,違反 Apple arm64 ABI。ConsolePal..cctor 建立物件陣列時觸發此 bug →
          # OutOfMemoryException: Array dimensions exceeded supported range → ARCHIVE FAILED
          # (dotnet/runtime#64103)。macos-15 runner 為 arm64 VM,觸發此 bug。
          #
          # 先前嘗試(PTY / controlling terminal / TIOCSWINSZ / TERM)均未修正——證實崩潰
          # 與終端完全無關,純為 .NET arm64 R2R bug。
          #
          # 修正:il2cpp_pty_wrapper.sh 設 COMPlus_ReadyToRun=0 停用 R2R,改用 JIT 編譯
          # (避開 bug)。另設 stdin=/dev/null 防 il2cpp 讀 stdin 阻塞。
          #
          # 注意:tarball 在 Windows 建立,不保留 Unix 執行位元,故需 chmod +x。
          for arch in deploy_arm64 deploy_x86_64; do
            il2cpp_dir="build/ios-xcode/Il2CppOutputProject/IL2CPP/build/$arch"
            if [[ -f "$il2cpp_dir/il2cpp" && ! -f "$il2cpp_dir/il2cpp.real" ]]; then
              mv "$il2cpp_dir/il2cpp" "$il2cpp_dir/il2cpp.real"
              chmod +x "$il2cpp_dir/il2cpp.real"
              cp codebase/scripts/il2cpp_pty_wrapper.sh "$il2cpp_dir/il2cpp"
              chmod +x "$il2cpp_dir/il2cpp"
              echo "✅ 已安裝 R2R 停用 wrapper(COMPlus_ReadyToRun=0)於 $arch/il2cpp"
            fi
          done

      - name: xcodebuild 封存並打包 .ipa(未簽署)
        id: build
        env:
          XCODEBUILD_ONLY: '1'
          XCODE_PROJECT_DIR: ${{ github.workspace }}/build/ios-xcode
          ARCHIVE_DIR: ${{ github.workspace }}/build
          OUTPUT_DIR: ${{ github.workspace }}/build/output
        run: ./codebase/scripts/build_unity_ipa.sh

      - name: 上傳 .ipa 成品(供下載)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: |
            build/output/*.ipa
            build/output/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: 上傳 dSYM 符號檔
        uses: actions/upload-artifact@v4
        with:
          name: dsym
          path: build/output/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: 上傳 .ipa 至目標 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          manifest="build/output/manifest.json"
          app=$(jq -r '.appName' "$manifest")
          ver=$(jq -r '.version' "$manifest")

          # 建立 release(若不存在);不使用 --verify-tag,允許自動建立標籤
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::發行版本 $tag 已存在,更新資產。"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$app $ver" \
              --generate-notes
            echo "已建立發行版本 $tag"
          fi

          # 收集資產(nullglob 避免空 glob)
          shopt -s nullglob
          assets=(build/output/*.ipa "$manifest")
          dsyms=(build/output/*.dSYM.zip)
          shopt -u nullglob
          if (( ${#dsyms[@]} )); then assets+=("${dsyms[@]}"); fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          echo "已上傳資產至 release $tag"

      - name: 寫入執行摘要
        env:
          XCODE_EXPORT_TAG: ${{ inputs.xcode_export_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "### iOS 建置完成(未簽署)"
            echo ""
            echo "| 項目 | 值 |"
            echo "| --- | --- |"
            echo "| Xcode 匯出來源 | \`${XCODE_EXPORT_TAG}\` |"
            echo "| 目標發行標籤 | \`${RELEASE_TAG}\` |"
            echo "| IPA 檔名 | \`${{ steps.build.outputs.ipa-file-name }}\` |"
            echo "| App | ${{ steps.build.outputs.app-name }} |"
            echo "| 版本 | ${{ steps.build.outputs.app-version }} |"
            echo "| Bundle ID | ${{ steps.build.outputs.bundle-id }} |"
            echo ""
            echo "- Release:https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- deploy:docs
  # [v2.6.1 停用] 儲存庫已改為私有,GitHub Pages 需付費方案(GitHub Pro/Team/Enterprise)。
  # 入口網站(codebase/site/)與 apps.json 饋流不再部署。IPA 直接由 GitHub Releases 下載。
  # 保留 job 定義以便日後儲存庫改回公開時重新啟用。
  deploy:
    name: 'deploy:docs'
    needs: build
    if: false  # v2.6.1: 儲存庫私有化,GitHub Pages 停用
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # v2.2.15: deploy-pages 需此權限查詢 artifact 中繼資料
      pages: write
      id-token: write   # actions/deploy-pages 必要
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 同一時間僅一個 Pages 部署,且不取消進行中的部署。
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定腳本為可執行
        run: chmod +x codebase/scripts/*.sh

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 暫存網站
        run: |
          set -euo pipefail
          echo "=== codebase/site/ 來源內容 ==="
          ls -la codebase/site/
          mkdir -p _site
          # v2.2.15: -v 顯示複製內容;驗證必要檔案存在(間歇性 cp 漏檔問題)
          cp -rv codebase/site/. _site/
          echo "=== _site/ 內容 ==="
          ls -la _site/
          for f in index.html style.css apps.json; do
            [[ -f "_site/$f" ]] || { echo "::error::_site/$f 缺失(cp 失敗)"; exit 1; }
          done
          echo "✅ 網站檔案驗證通過"

      - name: 產生 apps.json(最新發行版本)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./codebase/scripts/generate_apps_json.sh _site/apps.json codebase/app.config.json

      - name: 顯示產生的饋流
        run: cat _site/apps.json

      - name: 寫入執行摘要
        run: |
          {
            echo "### 入口網站與發行饋流"
            echo ""
            echo "- 網站:https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "- 饋流:https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apps.json"
            echo "- 最新發行版本:https://github.com/${{ github.repository }}/releases/latest"
            echo ""
            echo '```json'
            cat _site/apps.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上傳 Pages 成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 等待 artifact 可查詢(v2.2.17:規避 API 傳播競態)
        # v2.2.15: gh api 可查詢但 deploy-pages 內部 API 仍滯後 → deploy-pages 回報
        # Found 0 artifact(s)。v2.2.17:偵測到 artifact 後額外等待 5 秒,讓 GitHub
        # 內部 API 完全傳播,再執行 deploy-pages。
        run: |
          for i in $(seq 1 20); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo "0")
            if [ "$count" -gt 0 ]; then
              echo "✅ github-pages artifact 可查詢($count 個),等待 5 秒讓內部 API 傳播..."
              sleep 5
              echo "繼續部署"
              exit 0
            fi
            echo "等待 artifact 傳播...($i/20)"
            sleep 2
          done
          echo "::error::github-pages artifact 在 40 秒內未可查詢(API 傳播競態)"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4