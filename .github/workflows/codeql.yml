# codeql.yml — Swift 安全性/靜態分析。CodeQL Swift 分析會在編譯期間進行插樁,
# 因此未簽署建置必須先成功。
name: CodeQL 安全分析

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'   # 每週一
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: 分析(Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 選擇 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 設定腳本為可執行
        run: chmod +x codebase/scripts/*.sh

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          # 停用自動建置 — 我們自行執行未簽署建置(build-mode: manual)。
          build-mode: manual

      - name: 建置(未簽署,由 CodeQL 觀察)
        run: ./codebase/scripts/build_unsigned_ipa.sh

      - name: 執行 CodeQL 分析
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:swift'
